name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Dotnet info
        run: dotnet --info

      - name: Restore
        run: dotnet restore LedgerGraphQL.slnx

      - name: Build (Release)
        run: dotnet build LedgerGraphQL.slnx -c Release --no-restore

      - name: Test (Release)
        run: dotnet test LedgerGraphQL.slnx -c Release --no-build --logger "console;verbosity=normal"
